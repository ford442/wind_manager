name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Naga is the WGSL validator (scripts/validate-wgsl.mjs). Bump deliberately:
  # a newer Naga can reject or accept different WGSL.
  NAGA_VERSION: 30.0.2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high || true
      - run: npm run verify

      # Validate every concatenated shader module (common.wgsl + <shader>.wgsl,
      # plus the generated MAX_EMITTERS prelude) with Naga. No GPU needed.
      - name: Cache naga
        id: naga-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}
      - name: Install naga
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked
      - run: npm run check:wgsl

  # C++ reference for the documented scalar formulas (q_sat, virtual temperature,
  # d^2 step, latent dT). Golden values + parity with common.wgsl / params.ts.
  ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:ref
